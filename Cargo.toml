[package]
name = "structured-public-domains"
version = "0.0.27"
edition = "2024"
rust-version = "1.92"
authors = ["Structured World Foundation <foundation@sw.foundation>"]
description = "Compact Public Suffix List (PSL) for Rust. no_std + alloc, ~108KB embedded binary trie, O(depth * log k) lookup. Checked daily against publicsuffix.org."
documentation = "https://docs.rs/structured-public-domains/"
repository = "https://github.com/structured-world/structured-public-domains"
license = "Apache-2.0"
readme = "README.md"
keywords = ["psl", "public-suffix", "domain", "tld", "validation"]
categories = ["web-programming", "parser-implementations"]

[features]
default = ["std"]
# The trie is built with `alloc` types, so an allocator is not optional. This
# feature carries no code of its own and exists so a no-std consumer can name
# the shape it is asking for.
alloc = []
# Nothing in the lookup path needs an operating system. `std` is kept as the
# default so an existing consumer sees no change.
std = ["alloc"]

[dependencies]

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "lookup"
harness = false

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
